name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        run: |
          version="$(tr -d ' \t\n\r' < VERSION)"
          tag="${{ github.ref_name }}"
          if [ -z "$version" ]; then
            echo "error: VERSION is empty" >&2
            exit 1
          fi
          if [ "v${version}" != "${tag}" ]; then
            echo "error: tag ${tag} does not match VERSION v${version}" >&2
            exit 1
          fi
          echo "version ok: ${tag}"

      - name: Show toolchain
        run: swift --version

      # No tests / no app run by design; install-local.sh already ran this same script before tagging.
      - name: Build and assemble .app
        run: bash scripts/build-app.sh

      - name: Package .app into zip
        id: package
        run: |
          app="build/jj-ice.app"
          [ -d "$app" ] || { echo "error: $app not found" >&2; exit 1; }
          zip="jj-ice-macos.zip"
          # ditto (not zip) preserves bundle structure, symlinks and resource forks.
          ditto -c -k --keepParent "$app" "$zip"
          shasum -a 256 "$zip" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            jj-ice-macos.zip
            checksums.txt
